[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow-beta"
version = "0.1.0"
description = "Unified AgentFlow Planner optimization with terminal and process rewards"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
dependencies = ["pydantic>=2.0,<3", "PyYAML>=6.0"]

[project.optional-dependencies]
data = ["datasets>=3.0", "pyarrow>=19.0", "pandas>=2.0"]
retrieval = ["pyserini>=0.44,<1", "faiss-cpu>=1.9", "sentence-transformers>=3.0"]
services = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "transformers>=4.51,<6"]
runtime = [
  "accelerate>=1.0,<2",
  "openai>=1.30",
  "tenacity>=9.0",
  "vllm==0.12.0; platform_system == 'Linux'",
  "verl[vllm] @ git+https://github.com/verl-project/verl.git@7aed6b230776f963fa09509c10d9c3a767d1102c",
  "TransferQueue==0.1.6",
]

[tool.setuptools.packages.find]
where = ["src"]
